<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Jermey Chiang to Contacts</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    text-align: center;
    padding: 50px 20px;
    background: #f5f5f5;
}

.card {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 35px 25px;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

h1 {
    margin-bottom: 10px;
}

p {
    color: #666;
}

.button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin: 25px auto 15px;
    padding: 16px 25px;
    background: #007aff;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
}

.note {
    font-size: 14px;
    color: #888;
}
</style>
</head>

<body>

<div class="card">

    <h1>Jermey Chiang</h1>

    <p>Acculink Enterprises Corporation</p>

    <p>Add my contact information to your phone.</p>

    <button class="button" onclick="addContact()">
        Add Contact
    </button>

    <p class="note">
        iPhone and Android supported
    </p>

</div>

<script>
function addContact() {

    const vcfUrl =
        "https://raw.githubusercontent.com/jimimimij/business-card/refs/heads/main/Jermey_C.vcf";

    const link = document.createElement("a");

    link.href = vcfUrl;
    link.download = "Jermey_Chiang.vcf";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}
</script>

</body>
</html>
